<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nero">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Nero</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">JAMENDO</p>
        <h1>Nero</h1>
      </div>
      <button id="clearSearch" class="icon-btn" aria-label="Limpiar búsqueda" hidden>×</button>
    </header>

    <section class="search-wrap" aria-label="Buscar música">
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="search" inputmode="search"
             placeholder="Canción, artista o término"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="searchButton" class="search-btn" aria-label="Buscar">Buscar</button>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="results" class="results" aria-label="Resultados"></section>

    <section id="emptyState" class="empty">
      <div class="empty-mark">♪</div>
      <h2>Busca algo para escuchar</h2>
      <p>Explora música real de Jamendo.</p>
    </section>
  </main>

  <aside id="player" class="player" aria-label="Reproductor" hidden>
    <div class="player-inner">
      <img id="playerCover" class="player-cover" alt="">
      <div class="player-meta">
        <div id="playerTitle" class="player-title">Sin canción</div>
        <div id="playerArtist" class="player-artist"></div>
      </div>
      <button id="playerPlay" class="play-main" aria-label="Reproducir">▶</button>
    </div>

    <div class="progress-row">
      <span id="currentTime">0:00</span>
      <input id="progress" type="range" min="0" max="0" value="0" step="0.1" aria-label="Posición">
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prevButton" class="control-btn" aria-label="Anterior">⏮</button>
      <button id="bigPlay" class="big-play" aria-label="Reproducir">▶</button>
      <button id="nextButton" class="control-btn" aria-label="Siguiente">⏭</button>
    </div>
    <div id="audioStatus" class="audio-status" aria-live="polite"></div>
    <audio id="audio" preload="metadata" playsinline></audio>
  </aside>

  <script src="app.js"></script>
</body>
</html>
